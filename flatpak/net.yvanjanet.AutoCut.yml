app-id: net.yvanjanet.AutoCut
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: autocut

# FFmpeg is provided as a runtime extension rather than bundled, keeping the
# package size down.  Users must have org.freedesktop.Platform.ffmpeg-full
# installed; Flatpak will pull it automatically when installing this bundle.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .
    no-autodownload: false

finish-args:
  - --filesystem=home
  - --share=network
  # ffmpeg-full extension binaries land in /app/lib/ffmpeg
  - --env=PATH=/app/bin:/app/lib/ffmpeg:/usr/bin:/bin

modules:
  # Create the mount-point directory expected by the ffmpeg-full extension
  - name: ffmpeg-ext-dir
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg

  # Python packages are pre-downloaded by the CI workflow into flatpak/pip-packages/
  # and installed offline here with --no-index --find-links.
  # torch CPU variant keeps the bundle small; CUDA can still be used at runtime
  # if the user has a compatible driver (--device cuda CLI flag).
  - name: python-deps
    buildsystem: simple
    build-commands:
      - >-
        pip3 install --prefix=/app --ignore-requires-python
        --no-index --find-links pip-packages
        torch torchaudio
        click rich soundfile ffmpeg-python faster-whisper silero-vad
    sources:
      - type: dir
        path: pip-packages
        dest: pip-packages

  # Install autocut itself (deps already present above)
  - name: autocut
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --ignore-requires-python .
    sources:
      - type: dir
        path: ..
