name: Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to attach assets to GitHub releases

# Opt into Node.js 24 for all actions to silence the Node 20 deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  flatpak:
    name: Build and package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          sudo flatpak install -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      # --disable-sandbox bypasses bubblewrap (not available on GH Actions runners)
      # and allows pip to fetch packages from the network during build.
      - name: Build Flatpak
        run: |
          flatpak-builder \
            --disable-sandbox \
            --repo=repo \
            --force-clean \
            build-dir \
            flatpak/net.yvanjanet.AutoCut.yml

      - name: Export bundle
        run: |
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo \
            net.yvanjanet.AutoCut.flatpak \
            net.yvanjanet.AutoCut

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: autocut-flatpak
          path: net.yvanjanet.AutoCut.flatpak
          retention-days: 30

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: net.yvanjanet.AutoCut.flatpak
          fail_on_unmatched_files: true
