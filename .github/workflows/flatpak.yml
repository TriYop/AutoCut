name: Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to attach assets to GitHub releases

jobs:
  flatpak:
    name: Build and package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Uses the official flatpak-github-actions builder which installs the
      # freedesktop runtime/SDK from Flathub and runs flatpak-builder.
      # --disable-sandbox lets pip fetch packages from the network during build;
      # this is intentional for CI and not suitable for Flathub submission.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: net.yvanjanet.AutoCut.flatpak
          manifest-path: flatpak/net.yvanjanet.AutoCut.yml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/net.yvanjanet.AutoCut.yml') }}
          extra-args: --disable-sandbox

      # The action above already uploads the bundle as a workflow artifact.
      # This step additionally attaches it to the GitHub release when the
      # workflow is triggered by a version tag.
      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: net.yvanjanet.AutoCut.flatpak
          fail_on_unmatched_files: true
