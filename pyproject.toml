[project]
name = "autocut"
version = "0.1.0"
description = "Detect hesitations and stutters in webinar videos and export cut regions"
authors = [
    { name = "TriYop", email = "dev@yvanjanet.net" }
]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "click>=8.1",
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "ffmpeg-python>=0.2",
    "torch>=2.3",
    "torchaudio>=2.3",
    "rich>=13.0",
    "soundfile>=0.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov",
    "ruff>=0.9",
    "mypy>=1.11",
]
gui = [
    "PySide6>=6.7",
]

[project.scripts]
autocut = "autocut.main:cli"
autocut-gui = "autocut.gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocut"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
]
